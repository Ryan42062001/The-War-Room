name: War Room Resilience

on:
  push:
    paths:
      - 'index.html'
      - 'script.js'
      - 'service-worker.js'
      - 'js/**'
      - 'fantasypros-2026-data.js'
      - 'espn-2026-board-data.js'
      - 'war-room-config.js'
      - 'style.css'
      - 'draft-polish.css'
      - 'scripts/test-resilience.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resilience.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'script.js'
      - 'service-worker.js'
      - 'js/**'
      - 'fantasypros-2026-data.js'
      - 'espn-2026-board-data.js'
      - 'war-room-config.js'
      - 'style.css'
      - 'draft-polish.css'
      - 'scripts/test-resilience.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resilience.yml'

jobs:
  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate resilience syntax
        run: node --check service-worker.js && node --check js/war-room-resilience.js && node --check scripts/test-resilience.mjs
      - name: Test backup and offline reload
        run: node scripts/test-resilience.mjs
