name: War Room CI

on:
  push: {}
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        default: full
        type: choice
        options: [fast, full]

permissions:
  contents: read

jobs:
  governance:
    name: governance
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate Speed Workflow V2.1 contract
        run: python3 .github/scripts/validate_phase_workflow.py
      - run: npm ci
      - name: FAST application validation
        run: |
          npm run test:release
          npm run test:modules
          npm run test:syntax
          npm run test:dataset
          npm run test:extension

  test:
    name: test
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'full-phase-ci') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate Speed Workflow V2.1 contract
        run: python3 .github/scripts/validate_phase_workflow.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: FULL application validation
        run: npm test
      - name: Bounded determinism repeat
        run: |
          for iteration in 1 2 3; do
            echo "Critical browser determinism iteration $iteration/3"
            npm run test:browser
            npm run test:persistence-recovery
            npm run test:command-bar
          done
      - name: Dependency audit
        run: npm audit --audit-level=high
