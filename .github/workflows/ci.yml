name: War Room CI

on:
  push: {}
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        default: full
        type: choice
        options: [fast, full]

permissions:
  contents: read

concurrency:
  group: war-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    timeout-minutes: 10
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate Speed Workflow V2.1 contract
        run: python3 .github/scripts/validate_phase_workflow.py
      - run: npm ci
      - name: Validate release shape
        run: timeout 120s npm run test:release
      - name: Validate production modules
        run: timeout 120s npm run test:modules
      - name: Validate syntax
        run: timeout 120s npm run test:syntax
      - name: Validate dataset baseline
        run: timeout 120s npm run test:dataset
      - name: Validate browser-free companion tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find extensions/espn-companion/test -maxdepth 1 -name '*.test.cjs' ! -name 'click-provenance-v2.test.cjs' | sort)
          timeout 120s node --test "${files[@]}"
      - name: Note browser-backed companion coverage
        run: echo "click-provenance-v2.test.cjs requires Playwright Chromium and remains in deliberate FULL PHASE CI."

  test:
    name: test
    timeout-minutes: 30
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'full-phase-ci') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate Speed Workflow V2.1 contract
        run: python3 .github/scripts/validate_phase_workflow.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: FULL application validation
        run: npm test
      - name: Bounded determinism repeat
        run: |
          for iteration in 1 2 3; do
            echo "Critical browser determinism iteration $iteration/3"
            npm run test:browser
            npm run test:persistence-recovery
            npm run test:command-bar
          done
      - name: Dependency audit
        run: npm audit --audit-level=high
