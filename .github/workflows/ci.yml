name: War Room CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture WR-026 pre-change phone baseline
        run: node scripts/measure-wr026-phone-baseline.mjs
      - name: Upload WR-026 phone baseline
        uses: actions/upload-artifact@v4
        with:
          name: wr-026-phone-baseline-${{ github.sha }}
          path: artifacts/wr-026-phone-baseline.json
      - run: npm test
      - name: Validate resilience syntax
        run: node --check service-worker.js && node --check js/war-room-resilience.js && node --check scripts/test-resilience.mjs
      - name: Test backup and offline reload
        run: node scripts/test-resilience.mjs
