name: WR-029 Benchmark Lock

on:
  push:
    branches: [wr-029-advanced-context-enrichment]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ai/research/wr029_requirements.txt
      - name: Install research dependencies
        run: pip install -r .ai/research/wr029_requirements.txt
      - name: Verify prospective frozen artifacts before lock
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          checks = {
            '.ai/research/generated/CONTEXT_SHADOW_2026_SNAPSHOT.csv': '9e100543d90ce20286a102618e0f244a90090785b456fb9493791cbba5dd0a6d',
            '.ai/research/WR023_2026_PROSPECTIVE_EVALUATION_PROTOCOL.md': 'f6ef7484c28bafce45f0e841fc1cee0b67860c7741d0c8d4038248957e43a32c',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(open(path,'rb').read()).hexdigest()
              assert actual == expected, (path, actual, expected)
              print(path, actual)
          PY
      - name: Generate benchmark and source lock only
        run: python .ai/research/wr029_benchmark_lock.py
      - name: Hash benchmark lock
        shell: bash
        run: |
          sha256sum .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.json | awk '{print $1}' > .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.sha256
          cat .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.sha256
      - name: Verify prospective frozen artifacts after lock
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          checks = {
            '.ai/research/generated/CONTEXT_SHADOW_2026_SNAPSHOT.csv': '9e100543d90ce20286a102618e0f244a90090785b456fb9493791cbba5dd0a6d',
            '.ai/research/WR023_2026_PROSPECTIVE_EVALUATION_PROTOCOL.md': 'f6ef7484c28bafce45f0e841fc1cee0b67860c7741d0c8d4038248957e43a32c',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(open(path,'rb').read()).hexdigest()
              assert actual == expected, (path, actual, expected)
          PY
      - name: Persist exact lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.json .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.sha256
          git commit -m 'WR-029 freeze benchmark and source lock'
          git push
      - name: Upload lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: wr029-benchmark-lock
          path: |
            .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.json
            .ai/research/generated/ADV_CONTEXT_BENCHMARK_LOCK.sha256
          if-no-files-found: error
