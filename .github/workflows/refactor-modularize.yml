name: Refactor War Room modules

on:
  push:
    branches:
      - refactor/modular-war-room-first-pass

permissions:
  contents: write

jobs:
  modularize:
    if: ${{ !contains(github.event.head_commit.message, '[modularized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-war-room-first-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Split production script
        run: node scripts/split-war-room.mjs
      - name: Commit generated modules
        run: |
          # GitHub Apps cannot update workflow files without the separate
          # workflows permission. CI cleanup is committed later through the
          # repository connector, so keep this one-time generated commit to
          # production/documentation files only.
          git restore .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js js index.html package.json README.md AGENTS.md scripts/validate-production-modules.mjs
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[modularized] Split War Room production script"
          git push origin HEAD:refactor/modular-war-room-first-pass
