name: WR-034 Availability Research

on:
  push:
    branches:
      - wr-034-availability-expected-games
    paths:
      - '.github/workflows/wr034-availability-research.yml'
      - '.ai/research/AVAILABILITY_EXPECTED_GAMES_PROTOCOL.md'
      - '.ai/research/AVAILABILITY_SOURCE_MANIFEST.md'
      - '.ai/research/AVAILABILITY_CANDIDATE_SPEC.md'
      - '.ai/research/AVAILABILITY_PRE_SCORING_SOURCE_CORRECTION.md'
      - '.ai/research/generated/AVAILABILITY_EXPECTED_GAMES_PROTOCOL.json'
      - '.ai/research/wr034_availability_expected_games.py'
      - '.ai/research/wr034_requirements.txt'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ai/research/wr034_requirements.txt
      - name: Install pinned research dependencies
        run: python -m pip install -r .ai/research/wr034_requirements.txt
      - name: Static syntax check
        run: python -m py_compile .ai/research/wr034_availability_expected_games.py
      - name: Guarded historical expected-games experiment
        run: python .ai/research/wr034_availability_expected_games.py
      - name: Upload frozen research outputs
        uses: actions/upload-artifact@v4
        with:
          name: wr034-availability-results
          path: .ai/research/generated/WR034_*
          if-no-files-found: error
      - name: Commit generated research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/research/generated/WR034_*
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'WR-034 freeze guarded availability experiment outputs'
            git push origin HEAD:wr-034-availability-expected-games
          fi
