name: WR-025 Historical Ranking Research

on:
  push:
    branches: [wr-025-historical-ranking-signals]

permissions:
  contents: write

jobs:
  experiment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ai/research/wr025_requirements.txt
      - name: Install research dependencies
        run: pip install -r .ai/research/wr025_requirements.txt
      - name: Verify frozen prospective artifacts before research
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          checks = {
            '.ai/research/generated/CONTEXT_SHADOW_2026_SNAPSHOT.csv': '9e100543d90ce20286a102618e0f244a90090785b456fb9493791cbba5dd0a6d',
            '.ai/research/WR023_2026_PROSPECTIVE_EVALUATION_PROTOCOL.md': 'f6ef7484c28bafce45f0e841fc1cee0b67860c7741d0c8d4038248957e43a32c',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(open(path,'rb').read()).hexdigest()
              assert actual == expected, (path, actual, expected)
              print(path, actual)
          PY
      - name: Run WR-025 historical experiment
        run: python .ai/research/wr025_historical_ranking_signals.py
      - name: Verify frozen prospective artifacts after research
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          checks = {
            '.ai/research/generated/CONTEXT_SHADOW_2026_SNAPSHOT.csv': '9e100543d90ce20286a102618e0f244a90090785b456fb9493791cbba5dd0a6d',
            '.ai/research/WR023_2026_PROSPECTIVE_EVALUATION_PROTOCOL.md': 'f6ef7484c28bafce45f0e841fc1cee0b67860c7741d0c8d4038248957e43a32c',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(open(path,'rb').read()).hexdigest()
              assert actual == expected, (path, actual, expected)
          PY
      - name: Persist exact generated research outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/research/generated/HISTORICAL_RANKING_*
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'WR-025 freeze historical research outputs'
            git push
          fi
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: wr025-historical-ranking-results
          path: .ai/research/generated/HISTORICAL_RANKING_*
          if-no-files-found: error
