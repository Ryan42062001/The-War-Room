name: WR-023 Freeze Protocol Manifest

on:
  push:
    branches:
      - wr-023-prospective-protocol-freeze
    paths:
      - '.github/workflows/wr023-freeze-manifest.yml'
      - '.ai/research/wr023_freeze_manifest.py'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate and verify WR-023 manifest
        run: python .ai/research/wr023_freeze_manifest.py

      - name: Commit immutable hash manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/research/generated/WR023_PROTOCOL_MANIFEST.json
          git diff --cached --quiet && exit 1
          git commit -m 'WR-023 freeze protocol hash manifest'
          git push
