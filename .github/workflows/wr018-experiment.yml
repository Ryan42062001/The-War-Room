name: WR-018 Experimental Shadow Model

on:
  push:
    branches: [wr-018-open-data-shadow-ranking]
    paths:
      - '.ai/research/wr018_shadow_experiment.py'
      - '.ai/research/wr018_requirements.txt'
      - '.github/workflows/wr018-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ai/research/wr018_requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r .ai/research/wr018_requirements.txt
      - name: Run WR-018 experiment
        run: python .ai/research/wr018_shadow_experiment.py
      - name: Freeze generated research outputs on the WR-018 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/research/generated/SHADOW_RANKING_RESULTS.json \
                  .ai/research/generated/SHADOW_RANKING_ASSET_MANIFEST.json \
                  .ai/research/generated/SHADOW_RANKING_2026_SNAPSHOT.csv
          if git diff --cached --quiet; then
            echo "No generated output changes to commit"
          else
            git commit -m "WR-018 freeze generated shadow-model outputs"
            git push origin HEAD:wr-018-open-data-shadow-ranking
          fi
      - name: Upload WR-018 research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr018-shadow-results
          path: .ai/research/generated/
          if-no-files-found: error
          retention-days: 3
