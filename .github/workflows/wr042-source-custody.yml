name: WR-042 Trusted Source Custody
run-name: WR-042 custody bootstrap — ${{ inputs.manifest_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      manifest_commit_sha:
        description: Exact 40-character commit containing the inert manifest
        required: true
        type: string
      manifest_path:
        description: Approved .ai/research/generated or .ai/work_helper JSON path
        required: true
        type: string
      manifest_sha256:
        description: Exact SHA-256 of the manifest bytes
        required: true
        type: string
      safety_confirmation:
        description: Type I_CONFIRM_ELIGIBLE_PRE2026_CUSTODY_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wr042-trusted-source-custody
  cancel-in-progress: false

jobs:
  bootstrap-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on default-branch bootstrap
        run: |
          echo 'This default-branch file only registers the WR-042 manual workflow.'
          echo 'Custody execution is not authorized from the bootstrap implementation.'
          exit 1
