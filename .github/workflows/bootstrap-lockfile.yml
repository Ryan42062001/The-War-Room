name: Bootstrap root lockfile

on:
  push:
    branches:
      - refactor/modular-war-room-first-pass

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/modular-war-room-first-pass
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "[lockfile] Add deterministic root npm lockfile"
          git push origin HEAD:refactor/modular-war-room-first-pass
